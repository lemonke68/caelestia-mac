# Ported from dotfiles-hyprlain (caelestia apply-cava.sh output).
# Colours live in theme.conf, written by mac-rice/bin/theme-switch.
# The stock commented config is kept in kitty.conf.bak.
include theme.conf

background_opacity 0.78
background_blur 24
font_family JetBrainsMono Nerd Font
font_size 13.0
cursor_shape beam
cursor_beam_thickness 1.5
scrollback_lines 10000
remember_window_size no

window_padding_width 12
hide_window_decorations titlebar-only
confirm_os_window_close 0
